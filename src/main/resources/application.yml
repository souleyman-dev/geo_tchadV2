spring:
  application:
    name: geo-tchad
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/geo_tchad?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:springuser}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true